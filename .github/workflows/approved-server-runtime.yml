name: Deploy approved server fixes (2026-10-07)

on:
  push:
    branches: [ops/server-runtime-20261007]
    paths:
      - .github/workflows/approved-server-runtime.yml
      - deploy/approved_server_release.py
      - deploy/check_approved_server_release.py
      - tests/test_approved_server_release.py
      - deploy/telegram_network_diagnostics.py
      - tests/test_telegram_network_diagnostics.py

permissions:
  contents: read

env:
  XASS_OPERATION: diagnose-telegram

concurrency:
  group: xass-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/ops/server-runtime-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify the approved code and deployment safety tests
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          PYTHONPATH: .
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -B deploy/check_approved_server_release.py
      - name: Read-only Telegram DNS, TCP, TLS, HTTP and backend diagnostics
        if: env.XASS_OPERATION == 'diagnose-telegram'
        shell: bash
        env:
          SSH_HOST: 51.250.80.137
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          {
            printf "cd /home/red/serverredus\n.venv/bin/python -B - --logs-and-control-only <<'XASS_TELEGRAM_DIAGNOSTIC_PY'\n"
            cat deploy/telegram_network_diagnostics.py
            printf '\nXASS_TELEGRAM_DIAGNOSTIC_PY\n'
          } | bash deploy/github_ssh.sh exec
      - name: Preflight, verified backup, deploy and live checks with rollback
        if: env.XASS_OPERATION == 'deploy'
        shell: bash
        env:
          SSH_HOST: 51.250.80.137
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          {
            printf "cd /home/red/serverredus\n.venv/bin/python -B - '%s' '%s' <<'XASS_APPROVED_RELEASE_PY'\n" "$DEPLOY_SHA" "$DEPLOY_RUN"
            cat deploy/approved_server_release.py
            printf '\nXASS_APPROVED_RELEASE_PY\n'
          } | bash deploy/github_ssh.sh exec
