name: Build Windows agent

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "pc_client/**"
      - "app/services/agent_installer.py"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:

concurrency:
  group: xass-windows-agent
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pc_client/requirements.txt
            pc_client/build-requirements.txt
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: powershell
        run: .\pc_client\build_installer.ps1 -SkipToolInstall
      - uses: actions/upload-artifact@v4
        with:
          name: xass-windows-installer
          path: |
            pc_client/dist/installer/XASS-Setup.exe
            pc_client/dist/installer/XASS-Setup.json
          if-no-files-found: error
          retention-days: 30

  deploy-installer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xass-windows-installer
          path: release
      - name: Resolve VPS host through DNS-over-HTTPS
        id: vps
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_FALLBACK_IP: 51.250.80.137
        run: |
          set -euo pipefail
          if [[ "$SSH_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "host=$SSH_HOST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ip="$(curl --fail --silent --show-error --retry 3 \
            -H 'accept: application/dns-json' \
            "https://cloudflare-dns.com/dns-query?name=${SSH_HOST}&type=A" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((item["data"] for item in data.get("Answer", []) if item.get("type") == 1), ""))')" || true
          if [[ ! "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::DNS lookup failed for ${SSH_HOST}; using the verified VPS fallback IP"
            ip="$SSH_FALLBACK_IP"
          fi
          echo "host=$ip" >> "$GITHUB_OUTPUT"
      - name: Publish installer to XASS server
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.vps.outputs.host }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "release/XASS-Setup.exe,release/XASS-Setup.json"
          target: "/home/red/serverredus/data/releases"
          strip_components: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xass-windows-installer
          path: release
      - name: Publish stable public download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: agent-latest
          name: XASS for Windows — latest stable
          body: |
            Автоматически собранный стабильный установщик XASS для Windows.
            Установщик обновляется при каждом выпуске агента и сохраняет рабочую конфигурацию предыдущей версии.
          files: |
            release/XASS-Setup.exe
            release/XASS-Setup.json
          overwrite_files: true
          fail_on_unmatched_files: true
