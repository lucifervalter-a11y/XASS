name: Inspect XASS deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xass-readonly-deployment-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only orphan snapshot diagnostics
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          bash deploy/github_ssh.sh exec <<'REMOTE'
          cd /home/red/serverredus
          printf 'CHECKOUT\n'
          git rev-parse HEAD
          git status --short --untracked-files=no
          printf 'BACKEND STATUS\n'
          systemctl is-active serverredus-backend.service || true
          printf 'FILESYSTEM CAPACITY\n'
          df -h
          printf 'TARGETED SNAPSHOT INSPECTION\n'
          python3 - <<'PY_READONLY'
          import json, os, subprocess, time
          from pathlib import Path
          scope = Path("/home/red/.xass-predeploy/9663f007b0facf8d3c6625eb4189c7b3d16ef7e5-34169586139-1")
          token = scope.name.encode()
          print(json.dumps({"utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "snapshot_scope": str(scope), "exists": scope.is_dir()}))
          found = []
          for proc in Path("/proc").iterdir():
              if not proc.name.isdecimal():
                  continue
              try:
                  argv = (proc / "cmdline").read_bytes().split(b"\0")
                  descriptor_paths = []
                  for fd in (proc / "fd").iterdir():
                      try:
                          link = os.readlink(fd)
                          if link == str(scope) or link.startswith(str(scope) + "/"):
                              descriptor_paths.append({"fd": fd.name, "path": link})
                      except OSError:
                          pass
                  if token not in argv and not descriptor_paths:
                      continue
                  status = dict(line.split(":", 1) for line in (proc / "status").read_text().splitlines() if ":" in line)
                  parent = status.get("PPid", "").strip()
                  metrics = subprocess.check_output(["ps", "-p", proc.name, "-o", "etimes=,pcpu=,stat="], text=True).strip()
                  found.append({"pid_digits": list(proc.name), "parent_pid_digits": list(parent),
                                "name": status.get("Name", "").strip(), "elapsed_cpu_state": metrics,
                                "cwd": os.readlink(proc / "cwd"), "exact_snapshot_argument_match": token in argv,
                                "open_snapshot_files": descriptor_paths})
              except (OSError, subprocess.CalledProcessError):
                  continue
          print(json.dumps({"matched_processes": found}, ensure_ascii=True))
          if scope.is_dir():
              for directory, children, files in os.walk(scope, followlinks=False):
                  relative = Path(directory).relative_to(scope)
                  if len(relative.parts) >= 2:
                      children[:] = []
                  for child in children:
                      if child.startswith(".snapshot-"):
                          print(json.dumps({"snapshot_work_directory": str(Path(directory) / child)}))
                  for name in files:
                      if name not in {"before-revision", "server.tar.gz", "server.xass-server"}:
                          continue
                      path = Path(directory) / name
                      if not path.is_symlink():
                          info = path.stat()
                          print(json.dumps({"file": str(path), "bytes": info.st_size, "modified_epoch": info.st_mtime}))
          PY_READONLY
          REMOTE
