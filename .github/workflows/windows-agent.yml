name: Inspect XASS deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xass-readonly-deployment-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only publication permissions and backend timeout diagnostics
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          bash deploy/github_ssh.sh exec <<'REMOTE'
          cd /home/red/serverredus
          printf 'CHECKOUT\n'
          git rev-parse HEAD
          git status --short --untracked-files=no
          printf 'PUBLIC PATH PERMISSIONS (no file contents)\n'
          for target in /home /home/red /home/red/serverredus /home/red/serverredus/miniapp.php /home/red/serverredus/assets /home/red/serverredus/assets/miniapp-device-key.js /home/red/serverredus/proxy.php /home/red/serverredus/sw.js; do
            stat -Lc '%A mode=%a owner=%U group=%G path=%n' "$target" || true
          done
          printf 'LOCAL HTTPS STATUS (no response contents)\n'
          for path in /miniapp.php /health /assets/miniapp-device-key.js /sw.js; do
            printf 'path=%s ' "$path"
            curl --silent --show-error --connect-timeout 5 --max-time 12 --resolve redvps.site:443:127.0.0.1 -o /dev/null -w 'status=%{http_code} content_type=%{content_type} seconds=%{time_total}\n' "https://redvps.site$path" || true
          done
          printf 'LOCAL BACKEND HEALTH\n'
          curl --silent --show-error --connect-timeout 5 --max-time 8 -o /dev/null -w 'status=%{http_code} seconds=%{time_total}\n' http://127.0.0.1:8000/health || true
          printf 'BACKEND USER AND TIMEOUTS\n'
          systemctl show serverredus-backend.service --property=User --property=Group --property=TimeoutStopUSec --property=TimeoutStartUSec
          printf 'BACKEND UNIT AND DROP-IN PATHS ONLY (no unit contents)\n'
          systemctl show serverredus-backend.service --property=FragmentPath --property=DropInPaths
          REMOTE
