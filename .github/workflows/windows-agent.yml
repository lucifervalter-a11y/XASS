name: Inspect XASS deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xass-readonly-deployment-diagnostics
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stop only confirmed orphan snapshot and reclaim its incomplete files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          bash deploy/github_ssh.sh exec <<'REMOTE'
          cd /home/red/serverredus
          sudo -n python3 - <<'PY_RECOVER'
          import json, os, select, signal, stat, subprocess, time
          from pathlib import Path
          root = Path("/home/red/serverredus")
          scope = Path("/home/red/.xass-predeploy/9663f007b0facf8d3c6625eb4189c7b3d16ef7e5-34169586139-1")
          archive = scope / ".snapshot-qakktlrg" / "server.tar.gz"
          encrypted = scope / "server.xass-server"
          pid = 522841
          old_head = "0febf036824ede0e38099bc58cee0b1150166fb7"
          head = lambda: subprocess.check_output(["git", "-c", "safe.directory=/home/red/serverredus", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
          def validate_paths():
              if scope.is_symlink() or scope.resolve(strict=True) != scope:
                  raise RuntimeError("Snapshot scope is linked or moved; refusing action")
              for target in (archive, encrypted):
                  if target.is_symlink() or target.resolve() != target:
                      raise RuntimeError("Target is linked or outside its exact expected location")
                  if target.exists() and not stat.S_ISREG(target.stat().st_mode):
                      raise RuntimeError("Target is not a regular file")
          def identity():
              proc = Path("/proc") / str(pid)
              argv = (proc / "cmdline").read_bytes().split(b"\0")
              if argv.count(scope.name.encode()) != 1 or b"-" not in argv:
                  raise RuntimeError("PID no longer matches the exact backup run")
              if Path(os.readlink(proc / "cwd")) != root:
                  raise RuntimeError("Backup cwd no longer matches")
              matching = []
              for fd in (proc / "fd").iterdir():
                  try:
                      link = os.readlink(fd)
                  except FileNotFoundError:
                      continue
                  if link.startswith(str(scope) + "/"):
                      matching.append(link)
              if not matching:
                  raise RuntimeError("PID no longer has an open file in the exact snapshot scope")
              start = (proc / "stat").read_text().rsplit(") ", 1)[1].split()[19]
              return start
          validate_paths()
          print(json.dumps({"head_before": head(), "pid_digits": list(str(pid))}), flush=True)
          interrupted = False
          try:
              handle = os.pidfd_open(pid, 0)
          except ProcessLookupError:
              handle = None
          if handle is not None:
              try:
                  if not select.select([handle], [], [], 0)[0]:
                      started = identity()
                      signal.pidfd_send_signal(handle, signal.SIGTERM)
                      interrupted = True
                      print("Sent TERM to verified snapshot pidfd", flush=True)
                      if not select.select([handle], [], [], 8)[0]:
                          if identity() != started:
                              raise RuntimeError("Process identity changed; refusing escalation")
                          signal.pidfd_send_signal(handle, signal.SIGKILL)
                          print("Sent KILL to the same reverified snapshot pidfd", flush=True)
                          if not select.select([handle], [], [], 5)[0]:
                              raise RuntimeError("Snapshot process has not exited; no files removed")
                  print("Snapshot pidfd confirms process exit", flush=True)
              finally:
                  os.close(handle)
          else:
              print("Snapshot process was already absent", flush=True)
          # Never remove a potentially completed backup when its temporary archive is gone.
          validate_paths()
          current_head = head()
          if not archive.exists():
              print(json.dumps({"cleanup": "preserved_finished_or_unknown_backup", "head_after": current_head}), flush=True)
          elif not interrupted and (current_head != old_head or (encrypted.exists() and encrypted.stat().st_size >= archive.stat().st_size)):
              print(json.dumps({"cleanup": "preserved_without_proof_of_interruption", "head_after": current_head}), flush=True)
          else:
              # Run as root so inaccessible process descriptors cannot hide another writer.
              holders = []
              for proc in Path("/proc").iterdir():
                  if not proc.name.isdecimal():
                      continue
                  try:
                      descriptors = list((proc / "fd").iterdir())
                  except FileNotFoundError:
                      continue
                  for fd in descriptors:
                      try:
                          link = os.readlink(fd)
                      except FileNotFoundError:
                          continue
                      if link == str(scope) or link.startswith(str(scope) + "/"):
                          holders.append(list(proc.name))
                          break
              if holders:
                  print(json.dumps({"remaining_holder_pid_digits": holders}), flush=True)
                  raise RuntimeError("Snapshot files are still open; no files removed")
              validate_paths()
              removed = []
              for target in (archive, encrypted):
                  if target.exists():
                      info = target.stat()
                      target.unlink()
                      removed.append({"file": str(target), "bytes": info.st_size, "allocated_bytes": info.st_blocks * 512})
              print(json.dumps({"cleanup": "removed_exact_incomplete_artifacts", "files": removed,
                                "total_bytes_removed": sum(item["bytes"] for item in removed), "head_after": head()}), flush=True)
          PY_RECOVER
          printf 'HEAD AFTER\n'
          git rev-parse HEAD
          printf 'BACKEND HEALTH\n'
          systemctl is-active serverredus-backend.service
          curl --fail --silent --show-error --max-time 8 http://127.0.0.1:8000/health
          printf '\nFILESYSTEM CAPACITY\n'
          df -h
          REMOTE
