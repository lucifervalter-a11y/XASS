name: Inspect XASS deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xass-readonly-deployment-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only server deployment diagnostics
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          bash deploy/github_ssh.sh exec <<'REMOTE'
          cd /home/red/serverredus
          printf 'CHECKOUT\n'
          git rev-parse HEAD
          git status --short --untracked-files=no
          printf 'PROCESSES (no arguments)\n'
          ps -eo pid,etimes,pcpu,comm --sort=-pcpu | head -n 15
          printf 'FILESYSTEM CAPACITY\n'
          df -h
          printf 'PREDEPLOY ARTIFACTS (filenames and sizes only)\n'
          if [ -d /home/red/.xass-predeploy ]; then
            find /home/red/.xass-predeploy -maxdepth 4 -type f \( -name before-revision -o -name server.xass-server -o -name server.tar.gz \) -printf '%f %s bytes\n'
          fi
          printf 'BACKEND STATUS\n'
          systemctl is-active serverredus-backend.service || true
          REMOTE
