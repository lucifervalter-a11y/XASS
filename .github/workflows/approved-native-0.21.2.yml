name: Build approved Windows 0.21.2 installer

on:
  push:
    branches: [ops/native-0.21.2-ci-20261007]
    paths: [.github/workflows/approved-native-0.21.2.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: xass-approved-windows-0.21.2-installer
  cancel-in-progress: true

env:
  RELEASE_SHA: ac39edb0da2d7e56b49428e1fd893f7b75f9d7a7

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pc_client/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless desktop and PHP test support
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli xvfb xauth python3-tk
      - name: Install complete pinned test dependencies
        run: python -m pip install -r requirements.txt -r pc_client/requirements.txt
      - name: Existing Python regression suite
        env:
          PYTHONUTF8: '1'
          XASS_TEST_PHP: /usr/bin/php
        run: xvfb-run -a python -X utf8 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser and PHP contracts
        run: |
          node --test tests/*.cjs tests/*.js
          php -l proxy.php
          php -l index.php
          php -l miniapp.php
          php -l profile.php

  build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      RELEASE_SHA: ac39edb0da2d7e56b49428e1fd893f7b75f9d7a7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            pc_client/requirements.txt
            pc_client/voice-requirements.txt
            pc_client/build-requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify the exact application revision
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA) { throw 'Release revision mismatch' }
          if (git status --porcelain) { throw 'Release checkout is not clean' }
      - name: Install Inno Setup on the build runner
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Verify voice child lifecycle without microphone
        shell: pwsh
        run: |
          dotnet run --project windows/VoiceLifecycle.Tests/VoiceLifecycle.Tests.csproj -c Release -- (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Voice lifecycle tests failed.' }
      - name: Build complete native installer and validate bundled runtime
        shell: pwsh
        run: ./windows/build_installer.ps1 -Revision $env:RELEASE_SHA -Distribution native -OutputDirectory artifacts/windows-installer
      - name: Install process inspection for the updater smoke
        run: python -m pip install psutil==7.0.0
      - name: Download verified stable 0.21.1 installer for upgrade and rollback coverage
        uses: actions/download-artifact@v4
        with:
          name: xass-native-installer
          run-id: 37677982722
          github-token: ${{ github.token }}
          path: artifacts/previous-native-installer
      - name: Verify previous installer identity and bytes
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root = Path('artifacts/previous-native-installer')
          data = json.loads((root / 'native-update.json').read_text())
          assert data['revision'] == '9b26976d2eccb7bfe707ad37348aa12e1096ab55'
          assert data['distribution'] == 'native'
          assert data['version'] == '0.21.1'
          assert data['sha256'] == '68615f596e91b4201a1f433f44f05b02ae915c45ea9d79b01ddd66cb0e28eb9e'
          installer = root / 'XASS-Native-Setup.exe'
          assert installer.stat().st_size == data['size']
          with installer.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == data['sha256']
      - name: Verify fresh install, upgrade and uninstall on the runner
        shell: pwsh
        run: ./windows/test_installer.ps1 -Installer artifacts/windows-installer/XASS-Native-Setup.exe -PayloadManifest artifacts/windows-installer/payload-manifest.json -PreviousInstaller artifacts/previous-native-installer/XASS-Native-Setup.exe -TargetMetadata artifacts/windows-installer/native-update.json
      - name: Verify immutable native revision and checksum
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          root = Path('artifacts/windows-installer')
          installer = root / 'XASS-Native-Setup.exe'
          with installer.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          for name in ('XASS-Native-Setup.json', 'native-update.json', 'payload-manifest.json'):
              data = json.loads((root / name).read_text())
              assert data['revision'] == os.environ['RELEASE_SHA'], 'Native revision mismatch'
              if name != 'payload-manifest.json':
                  assert data['distribution'] == 'native', 'Not a stable native installer'
                  assert data['sha256'] == digest, 'Native checksum mismatch'
          assert (root / (installer.name + '.sha256')).read_text().strip() == f'{digest}  {installer.name}'
      - uses: actions/upload-artifact@v4
        with:
          name: xass-native-installer
          path: artifacts/windows-installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: xass-native-installer-smoke
          path: artifacts/windows-native*-smoke.json
          if-no-files-found: error
          retention-days: 30
