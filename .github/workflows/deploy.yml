name: Deploy to redvps.site

on:
  push:
    branches: [main]

concurrency:
  group: xass-production
  # Interrupting an SSH client can leave a remote deployment running.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Resolve VPS host through DNS-over-HTTPS
        id: vps
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_FALLBACK_IP: 51.250.80.137
        run: |
          set -euo pipefail
          if [[ "$SSH_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "host=$SSH_HOST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ip="$(curl --fail --silent --show-error --retry 3 \
            -H 'accept: application/dns-json' \
            "https://cloudflare-dns.com/dns-query?name=${SSH_HOST}&type=A" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((item["data"] for item in data.get("Answer", []) if item.get("type") == 1), ""))')" || true
          if [[ ! "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::DNS lookup failed for ${SSH_HOST}; using the verified VPS fallback IP"
            ip="$SSH_FALLBACK_IP"
          fi
          echo "host=$ip" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        shell: bash
        env:
          SSH_HOST: ${{ steps.vps.outputs.host }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
            bash deploy/github_ssh.sh exec <<'REMOTE'
            set -euo pipefail
            cd /home/red/serverredus
            test -z "$(git status --porcelain --untracked-files=no)" || { echo 'Tracked server changes need review; deployment stopped.'; exit 1; }
            umask 077
            exec 9> /home/red/.xass-deployment.lock
            flock -w 120 9 || { echo 'Another server deployment is still running.'; exit 1; }
            echo '[INFO] Fetching release for bounded rollback backup...'
            git fetch --prune origin main
            git show '${{ github.sha }}:deploy/predeploy_backup.py' | .venv/bin/python - '${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
            # Backup files stay private; new public checkout files must be readable by PHP-FPM/nginx.
            umask 022
            bash deploy/update.sh
            # Also covers upgrading from an older, already-running update.sh.
            .venv/bin/python deploy/repair_public_permissions.py
            git merge-base --is-ancestor '${{ github.sha }}' HEAD
            for path in miniapp.php assets/miniapp-device-key.js health; do
              curl --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 8 --max-time 20 "https://redvps.site/$path" > /dev/null
            done
            echo '[OK] Public Mini App, assets and backend are reachable.'
            REMOTE
