name: Deploy to redvps.site

on:
  push:
    branches: [main]

concurrency:
  group: xass-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Resolve VPS host through DNS-over-HTTPS
        id: vps
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_FALLBACK_IP: 51.250.80.137
        run: |
          set -euo pipefail
          if [[ "$SSH_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "host=$SSH_HOST" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ip="$(curl --fail --silent --show-error --retry 3 \
            -H 'accept: application/dns-json' \
            "https://cloudflare-dns.com/dns-query?name=${SSH_HOST}&type=A" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((item["data"] for item in data.get("Answer", []) if item.get("type") == 1), ""))')" || true
          if [[ ! "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::DNS lookup failed for ${SSH_HOST}; using the verified VPS fallback IP"
            ip="$SSH_FALLBACK_IP"
          fi
          echo "host=$ip" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        shell: bash
        env:
          SSH_HOST: ${{ steps.vps.outputs.host }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
            bash deploy/github_ssh.sh exec <<'REMOTE'
            set -e
            cd /home/red/serverredus
            test -z "$(git status --porcelain --untracked-files=no)" || { echo 'Tracked server changes need review; deployment stopped.'; exit 1; }
            umask 077
            .venv/bin/python - '${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}' <<'PY'
            import os, secrets, subprocess, sys
            from pathlib import Path
            from app.config import Settings
            from app.services.server_backup import create_snapshot
            root = Path.cwd().resolve()
            directory = root.parent / '.xass-predeploy' / sys.argv[1]
            directory.mkdir(parents=True, exist_ok=False, mode=0o700)
            os.chmod(directory.parent, 0o700)
            password = secrets.token_urlsafe(48)
            (directory / 'passphrase').write_text(password, encoding='utf-8')
            (directory / 'before-revision').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True), encoding='utf-8')
            create_snapshot(root, Settings(), directory / 'server.xass-server', password=password)
            print('Private pre-deployment snapshot created; credentials remain on the VPS.')
            PY
            bash deploy/update.sh
            git merge-base --is-ancestor '${{ github.sha }}' HEAD
            REMOTE
