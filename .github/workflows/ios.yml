name: Build XASS iOS (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths: ["ios/**", ".github/workflows/ios.yml", "assets/xass-app-icon-source.png"]

permissions:
  contents: read

concurrency:
  group: xass-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: bash ios/prepare.sh
      - name: Simulator regression tests
        working-directory: ios
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "XASS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          # One short test bundle exercises the system audio session; extra simulator clones add no value.
          xcodebuild test -project XASS.xcodeproj -scheme XASS -destination "platform=iOS Simulator,id=$simulator_id" -parallel-testing-enabled NO -derivedDataPath build/simulator -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Capture real native screens (isolated simulator data, no account or audio)
        working-directory: ios
        run: |
          set -euo pipefail
          # XCTest may run on a temporary clone and shut down the requested device.
          simulator_state=$(xcrun simctl list devices available --json | python3 -c 'import json,os,sys; d=json.load(sys.stdin); print(next(x["state"] for devices in d["devices"].values() for x in devices if x["udid"] == os.environ["XASS_SIMULATOR_ID"]))')
          if [ "$simulator_state" != "Booted" ]; then
            xcrun simctl boot "$XASS_SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$XASS_SIMULATOR_ID" -b
          xcrun simctl install "$XASS_SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/XASS.app
          xcrun simctl launch --terminate-running-process "$XASS_SIMULATOR_ID" app.xass.mobile
          sleep 2
          mkdir -p build/package
          xcrun simctl io "$XASS_SIMULATOR_ID" screenshot build/package/iOS-first-connection.png
          for screen in library player devices routes storage; do
            xcrun simctl launch --terminate-running-process "$XASS_SIMULATOR_ID" app.xass.mobile --native-ui-fixture --native-ui-screen "$screen"
            sleep 3
            xcrun simctl io "$XASS_SIMULATOR_ID" screenshot "build/package/iOS-native-$screen.png"
          done
      - name: Build unsigned iPhone application
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild build -project XASS.xcodeproj -scheme XASS -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          expected_version=$(python3 -c 'import pathlib,re; print(re.search(r"MARKETING_VERSION: \"([^\"]+)\"", pathlib.Path("project.yml").read_text()).group(1))')
          actual_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/device/Build/Products/Release-iphoneos/XASS.app/Info.plist)
          test "$actual_version" = "$expected_version" || { echo "Packaged version does not match project.yml"; exit 1; }
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/XASS.app build/package/Payload/
          cd build/package
          ditto -c -k --sequesterRsrc --keepParent Payload XASS-unsigned.ipa
          python3 -c 'import plistlib,sys,zipfile; archive=zipfile.ZipFile("XASS-unsigned.ipa"); info=plistlib.loads(archive.read("Payload/XASS.app/Info.plist")); assert info["CFBundleShortVersionString"] == sys.argv[1], "IPA version mismatch"; assert info["CFBundleSupportedPlatforms"] == ["iPhoneOS"], "IPA is not an iPhone device build"' "$expected_version"
          shasum -a 256 XASS-unsigned.ipa > XASS-unsigned.ipa.sha256
          cp ../../UNSIGNED.md .
      - uses: actions/upload-artifact@v4
        with:
          name: XASS-iOS-UNSIGNED-requires-signing
          path: |
            ios/build/package/XASS-unsigned.ipa
            ios/build/package/XASS-unsigned.ipa.sha256
            ios/build/package/UNSIGNED.md
            ios/build/package/iOS-first-connection.png
            ios/build/package/iOS-native-*.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XASS-iOS-simulator-test-results
          path: ios/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XASS-iOS-UNSIGNED-requires-signing
          path: release
      - name: Publish explicitly unsigned iOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release edit ios-latest --title "XASS iOS — unsigned, requires your signing" --notes-file ios/UNSIGNED.md --prerelease
          else
            gh release create ios-latest --target "$GITHUB_SHA" --title "XASS iOS — unsigned, requires your signing" --notes-file ios/UNSIGNED.md --prerelease
          fi
          gh release upload ios-latest release/XASS-unsigned.ipa release/XASS-unsigned.ipa.sha256 release/UNSIGNED.md release/iOS-native-*.png --clobber
