# Include inside the existing HTTPS server block; run nginx -t before reload.
# Prefer the direct route over PHP so Discord's deadline is not spent in FPM.
location = /api/discord/interactions {
    client_max_body_size 64k;
    client_body_timeout 1s;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 500ms;
    proxy_read_timeout 1s;
    proxy_send_timeout 1s;
    proxy_intercept_errors off;
    proxy_pass_request_headers on;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Signature-Ed25519 $http_x_signature_ed25519;
    proxy_set_header X-Signature-Timestamp $http_x_signature_timestamp;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
}

location ^~ /api/discord/artwork/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_connect_timeout 500ms;
    proxy_read_timeout 1s;
    proxy_intercept_errors off;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
}
